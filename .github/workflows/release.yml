name: Publish to npm

# Publishes @keploy/sdk when a GitHub release is published.
# The release tag (e.g. v2.0.11) sets the package version, so the version on npm
# always matches a tagged commit on main.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # Without registry-url, setup-node writes no npm auth config and NODE_AUTH_TOKEN is ignored.
          registry-url: https://registry.npmjs.org

      - name: Set version from the release tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
